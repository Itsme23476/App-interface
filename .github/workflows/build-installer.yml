name: Build Windows Installer

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Validate semver tag
        if: github.event_name == 'release'
        run: |
          $version = "${{ github.ref_name }}" -replace '^[Vv]\.?', '' -replace '^\.', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            echo "ERROR: Version '$version' is not valid semver (expected X.Y.Z, e.g. 12.0.0)"
            echo "Tags must be like v12.0.0, v12.1.0, etc."
            exit 1
          }
          echo "Version '$version' is valid semver"
        shell: pwsh

      - name: Update version from release tag
        if: github.event_name == 'release'
        run: |
          $version = "${{ github.ref_name }}" -replace '^[Vv]\.?', '' -replace '^\.', ''
          $buildDate = Get-Date -Format "yyyy-MM-dd"
          echo "Setting app version to: $version"
          $q = '"'
          $content = @(
            '"""',
            'Version information for Filect - File Search Assistant.',
            '"""',
            '',
            "VERSION = $q$version$q",
            "BUILD_DATE = $q$buildDate$q",
            "APP_NAME = ${q}Filect$q",
            '',
            '# GitHub repository info (for reference)',
            "GITHUB_OWNER = ${q}Itsme23476$q",
            "GITHUB_REPO = ${q}App-interface$q",
            '',
            '# Update checking is now done via Supabase (app_version table)',
            '# This allows updates to work even with private GitHub repos'
          )
          $content | Out-File -FilePath "ai_file_organizer/app/version.py" -Encoding utf8
          echo "Updated version.py:"
          Get-Content "ai_file_organizer/app/version.py"
        shell: pwsh
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r ai_file_organizer/requirements.txt
          python -c "import PySide6; print(f'PySide6 version: {PySide6.__version__}')"
          python -c "from PySide6.QtWidgets import QApplication; print('QtWidgets OK')"
          python -c "from PySide6.QtCore import QCoreApplication; print('QtCore OK')"
      
      - name: Build with PyInstaller
        run: |
          cd ai_file_organizer
          $baseArgs = @(
            "--name", "Filect",
            "--windowed",
            # A folder, not one file: a --onefile exe unpacked ~390 MB on EVERY start (measured 26-31 s before it
            # answered as the MCP server; Claude Desktop gives up at 60 s, Codex at 10 s). dist\Filect\Filect.exe
            # + dist\Filect\_internal\ start without unpacking; the installer copies the whole folder.
            "--onedir",
            "--collect-all", "PySide6",
            "--collect-all", "shiboken6",
            "--collect-all", "spellchecker",
            "--collect-all", "sounddevice",
            "--collect-data", "spellchecker",
            "--collect-data", "certifi",
            "--add-data", "app/ui/styles.qss;app/ui",
            "--add-data", "app/ui/styles_light.qss;app/ui",
            "--add-data", "app/ui/fonts;app/ui/fonts",
            "--add-data", "resources;resources",
            "--hidden-import", "PySide6.QtCore",
            "--hidden-import", "PySide6.QtGui",
            "--hidden-import", "PySide6.QtWidgets",
            "--hidden-import", "PySide6.QtNetwork",
            "--hidden-import", "PySide6.QtSvg",
            "--hidden-import", "PySide6.QtSvgWidgets",
            "--hidden-import", "PIL",
            "--hidden-import", "PIL.Image",
            "--hidden-import", "requests",
            "--hidden-import", "certifi",
            "--hidden-import", "openai",
            "--hidden-import", "json5",
            "--hidden-import", "spellchecker",
            "--hidden-import", "psutil",
            "--hidden-import", "app.core.dictation_format",
            "--hidden-import", "app.core.video_analysis",
            "--hidden-import", "docx",
            "--hidden-import", "pptx",
            "--hidden-import", "lxml",
            "--hidden-import", "lxml.etree",
            "--hidden-import", "lxml._elementpath",
            "--hidden-import", "striprtf",
            "--hidden-import", "striprtf.striprtf",
            "--hidden-import", "ebooklib",
            "--hidden-import", "bs4",
            "--hidden-import", "soupsieve",
            "--hidden-import", "odf",
            "--hidden-import", "odf.opendocument",
            "--hidden-import", "odf.text",
            "--hidden-import", "odf.teletype",
            "--hidden-import", "imageio_ffmpeg",
            "--collect-data", "pptx",
            "--collect-data", "docx",
            "--collect-all", "imageio_ffmpeg",
            "--collect-all", "pypdfium2",
            "--collect-all", "pypdfium2_raw",
            "--collect-all", "pillow_heif",
            "--hidden-import", "openpyxl",
            "--hidden-import", "xlrd",
            "--paths", "..",
            "--hidden-import", "filect_mcp",
            "--hidden-import", "filect_mcp.server",
            "--hidden-import", "app.core.mcp_connect",
            "--collect-submodules", "mcp.server",
            "--collect-submodules", "mcp.shared",
            "--collect-submodules", "mcp.client",
            "--collect-data", "mcp",
            "--exclude-module", "mcp.cli",
            "--add-data", "app/ui/assets;app/ui/assets",
            "--hidden-import", "claude_agent_sdk",
            "--collect-submodules", "claude_agent_sdk",
            "--hidden-import", "app.ui.assistant_page",
            "--hidden-import", "app.ui.agents_view",
            "--hidden-import", "app.ui.details_view",
            "--hidden-import", "app.core.agent_runner",
            "--hidden-import", "app.core.agent_sessions",
            "--hidden-import", "app.core.intent_router",
            "--hidden-import", "app.core.codex_runner",
            "--hidden-import", "app.ui.agent_voice",
            "--hidden-import", "app.ui.agent_hotkey",
            "--hidden-import", "app.ui.claude_overlay",
            "--hidden-import", "app.ui.conversation_rail",
            "--hidden-import", "app.ui.screen_ink",
            "--hidden-import", "app.ui.win_panel",
            "--hidden-import", "app.ui.live_page",
            "--hidden-import", "app.core.live_listener",
            "--hidden-import", "app.core.speech_out",
            "--hidden-import", "app.core.mic_helper",
            "--hidden-import", "app.core.organize_reader",
            "--hidden-import", "webrtcvad",
            "--noconfirm"
          )
          if (Test-Path "resources/iconnn.ico") {
            echo "Building with icon..."
            $baseArgs += @("--icon", "resources/iconnn.ico")
          }
          $baseArgs += "main.py"
          pyinstaller @baseArgs
          $exePath = "dist\Filect\Filect.exe"
          if (Test-Path $exePath) {
            $size = (Get-ChildItem "dist\Filect" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
            echo "App folder size: $([math]::Round($size, 2)) MB"
          }
          dir dist\Filect
        shell: pwsh

      - name: Verify build output
        run: |
          if ((Test-Path "ai_file_organizer/dist/Filect/Filect.exe") -and (Test-Path "ai_file_organizer/dist/Filect/_internal")) {
            echo "Build successful!"
          } else {
            echo "ERROR: EXE not found!"
            exit 1
          }
        shell: pwsh
      
      - name: Create Inno Setup installer script
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($version) -or $version -eq "refs/heads/main") { $version = "1.0.0" }
          # Remove V/v prefix and any leading dots (handles v1.0.0, V.1.0.0, 1.0.0)
          $version = $version -replace '^[Vv]\.?', '' -replace '^\.', ''
          $iconLine = ""
          if (Test-Path "ai_file_organizer/resources/iconnn.ico") {
            $iconLine = "SetupIconFile=ai_file_organizer\resources\iconnn.ico"
          }
          @"
          [Setup]
          AppName=Filect
          AppVersion=$version
          AppPublisher=Filect
          DefaultDirName={autopf}\Filect
          DefaultGroupName=Filect
          OutputDir=installer
          OutputBaseFilename=Filect-Setup-v$version
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\Filect.exe
          CloseApplications=force
          CloseApplicationsFilter=Filect.exe
          RestartApplications=yes
          $iconLine
          
          [InstallDelete]
          ; (an update over an older one-file install: the old 390 MB Filect.exe is replaced below anyway; this
          ; clears a previous build's _internal folder so no stale library is left next to the new ones)
          Type: filesandordirs; Name: "{app}\_internal"

          [Files]
          Source: "ai_file_organizer\dist\Filect\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\Filect"; Filename: "{app}\Filect.exe"
          Name: "{commondesktop}\Filect"; Filename: "{app}\Filect.exe"
          
          [Run]
          ; For manual installs - shows checkbox on FINISH page (checked by default)
          Filename: "{app}\Filect.exe"; Description: "Launch Filect"; Flags: nowait postinstall runasoriginaluser shellexec skipifsilent
          ; For silent updates - always auto-launch (no checkbox needed)
          Filename: "{app}\Filect.exe"; Flags: nowait runasoriginaluser shellexec skipifnotsilent
          "@ | Out-File -FilePath installer.iss -Encoding utf8
        shell: pwsh
      
      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: cmd
      
      - name: Build Installer
        run: |
          mkdir installer
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: cmd
      
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/*.exe
          if-no-files-found: error
          retention-days: 1
      
      - name: Upload standalone exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-exe
          path: ai_file_organizer/dist/*.exe
          if-no-files-found: error
          retention-days: 1
      
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            ai_file_organizer/dist/*.exe
          fail_on_unmatched_files: true

      - name: Publish the installer to the public downloads repo
        id: publish
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          DOWNLOADS_REPO: Itsme23476/filect-downloads
        shell: pwsh
        run: |
          # The file people and the updater download lives in the PUBLIC repo filect-downloads (no code in it), so
          # this code repo can be private. Any failure here = the build stops BEFORE app_version, so everyone keeps
          # the previous version (this repo's own release link would 404 once it's private).
          $version = "${{ github.ref_name }}" -replace '^[Vv]\.?', '' -replace '^\.', ''
          $file = "Filect-Setup-v$version.exe"
          if (-not (Test-Path "installer/$file")) { echo "::error::installer/$file not found"; exit 1 }
          if ([string]::IsNullOrEmpty($env:GH_TOKEN)) { echo "::error::No DOWNLOADS_TOKEN secret: not publishing (users keep the previous version)"; exit 1 }
          $tag = "win-${{ github.ref_name }}"
          gh release view $tag -R $env:DOWNLOADS_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag -R $env:DOWNLOADS_REPO --title "Filect $version for Windows" --notes "The newest Filect is always at https://filect.io/download/windows"
            if ($LASTEXITCODE -ne 0) { echo "::error::release create failed (token expired?): not publishing"; exit 1 }
          }
          gh release upload $tag "installer/$file" -R $env:DOWNLOADS_REPO --clobber
          if ($LASTEXITCODE -ne 0) { echo "::error::upload failed (token expired?): not publishing"; exit 1 }
          $url = "https://github.com/$($env:DOWNLOADS_REPO)/releases/download/$tag/$file"
          for ($i = 0; $i -lt 6; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -UseBasicParsing
              if ($r.StatusCode -eq 200) { echo "Public download OK (no login): $url"; "url=$url" >> $env:GITHUB_OUTPUT; exit 0 }
            } catch {}
            Start-Sleep -Seconds 10
          }
          echo "::error::The public file isn't downloadable without a login: not publishing"; exit 1

      - name: Update Supabase app_version table
        if: github.event_name == 'release'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # Remove V/v prefix and any leading dots (handles v1.0.0, V.1.0.0, 1.0.0)
          $version = "${{ github.ref_name }}" -replace '^[Vv]\.?', '' -replace '^\.', ''
          $releaseName = $env:RELEASE_NAME
          if ([string]::IsNullOrEmpty($releaseName)) { $releaseName = "Filect v$version" }
          $releaseNotes = $env:RELEASE_BODY -replace '"', '\"' -replace "`r`n", ' ' -replace "`n", ' '
          
          # The PUBLIC downloads repo's link (the step above). Never fall back to this repo's own release link: once
          # this repo is private that link 404s for every customer's updater (the Mac removed its fallback: 23abbaa).
          $downloadUrl = "${{ steps.publish.outputs.url }}"
          if ([string]::IsNullOrEmpty($downloadUrl)) { echo "::error::No public download link: not publishing"; exit 1 }
          
          echo "Version: $version"
          echo "Download URL: $downloadUrl"
          
          if ([string]::IsNullOrEmpty($env:SUPABASE_SERVICE_KEY)) {
            echo "::warning::SUPABASE_SERVICE_KEY not set. Add it to repository secrets."
            exit 0
          }
          
          # Update app_version table with GitHub release URL
          $body = "{`"version`":`"$version`",`"download_url`":`"$downloadUrl`",`"release_name`":`"$releaseName`",`"release_notes`":`"$releaseNotes`",`"is_required`":false}"
          
          try {
            Invoke-RestMethod -Uri "https://gsvccxhdgcshiwgjvgfi.supabase.co/rest/v1/app_version" -Method Post -Headers @{
              "apikey" = $env:SUPABASE_SERVICE_KEY
              "Authorization" = "Bearer $env:SUPABASE_SERVICE_KEY"
              "Content-Type" = "application/json"
              "Prefer" = "return=minimal"
            } -Body $body
            echo "Successfully updated Supabase app_version"
          } catch {
            echo "::warning::Failed to update Supabase: $($_.Exception.Message)"
          }
        shell: pwsh
